# End-to-end tests in Docker (wp-env) with Playwright, with the same npm script used locally
# (see "Quality checks" in AGENTS/ARCHITECTURE.md and tests/e2e/README.md). Started by hand (*Run workflow*):
# whether they become automatic is an open issue. The file keeps its name because GitHub offers
# *Run workflow* only for the workflow files of the default branch.
# Actions are pinned to a full commit SHA, with the tag in a comment (checked by
# tests/unit/KKCE_CI_Workflow_Unit_Test.php); update the SHA and the comment together.
name: End-to-end tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end (Playwright, Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out the code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install the test tools and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: End-to-end suite (starts the wp-env development environment)
        run: npm run e2e

      - name: Keep the report and the traces of the failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop the environment
        if: always()
        run: npx wp-env stop
