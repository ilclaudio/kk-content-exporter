# Integration and end-to-end tests in Docker (wp-env), with the same npm scripts used locally
# (see "Quality checks" in AGENTS/ARCHITECTURE.md and tests/e2e/README.md).
# The integration job runs on every push and pull request to main and dev (decision of 2026-11-15, after
# a first clean run of about two minutes); the end-to-end job runs only when the workflow is started by
# hand, until it has five clean runs in a row. The checks of ci.yml are not changed.
# Actions are pinned to a full commit SHA, with the tag in a comment (checked by
# tests/unit/KKCE_CI_Workflow_Unit_Test.php); update the SHA and the comment together.
name: Functional tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Integration (wp-env)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install the development tools
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci

      - name: Integration suite in the wp-env test environment
        run: npm run test:integration

      - name: Stop the environment
        if: always()
        run: npx wp-env stop --config=.wp-env.tests.json

  e2e:
    name: End-to-end (Playwright, Chromium)
    # Started by hand only, for now.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out the code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install the test tools and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: End-to-end suite (starts the wp-env development environment)
        run: npm run e2e

      - name: Keep the report and the traces of the failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop the environment
        if: always()
        run: npx wp-env stop
