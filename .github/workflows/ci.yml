# Continuous integration: calls the same Composer scripts used locally and by the Git hooks
# (see "Quality checks" in AGENTS/ARCHITECTURE.md), checks the whitespace of the repository, builds the
# release ZIP, audits the npm test tools and runs the integration suite in Docker (wp-env) on WordPress 7.1.4
# and on the minimum version 6.4. The end-to-end suite is in functional.yml (started by hand).
# Actions are pinned to a full commit SHA, with the tag in a comment (checked by
# tests/unit/KKCE_CI_Workflow_Unit_Test.php); update the SHA and the comment together.
name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.4' ]
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Validate Composer configuration and lock file
        run: composer validate --no-check-publish

      - name: Install the development tools
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint, PHPCS, PHPStan and unit tests
        run: composer run check

  audit:
    name: Composer audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Audit the locked dependencies
        run: composer audit --locked

  repository:
    name: Whitespace and conflict markers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check every versioned file against an empty tree
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD -- .

  package:
    name: Release ZIP
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Validate Composer configuration and lock file
        run: composer validate --no-check-publish

      - name: Install the development tools
        run: composer install --no-interaction --no-progress --prefer-dist

      # The checks of the code run in the job "check": the build only verifies the package.
      - name: Build and verify the package
        run: composer run build:zip -- --skip-checks

  npm-audit:
    name: npm audit (test tools)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Test tools are never shipped; high and critical findings still block CI.
      - name: Audit the locked npm dependencies
        run: npm audit --audit-level=high

  integration:
    name: Integration (WordPress ${{ matrix.wordpress }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The version of .wp-env.inttest.json.
          - wordpress: '7.1.4'
            core: ''
          # The minimum version declared by the plugin.
          - wordpress: '6.4.14'
            core: 'https://wordpress.org/wordpress-6.4.14.zip'
    env:
      WP_ENV_CORE: ${{ matrix.core }}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Validate Composer configuration and lock file
        run: composer validate --no-check-publish

      - name: Install the development tools
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci

      - name: Integration suite in the wp-env test environment
        run: npm run test:integration

      - name: Stop the environment
        if: always()
        run: npm run env:tests:stop

  actionlint:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the workflows
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
